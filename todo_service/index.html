<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P4 / TODO</title>
<style>
:root{color-scheme:dark;--green:#00ae42}*{box-sizing:border-box}body{margin:0;background:#070a08;color:#f5f5f2;font:16px system-ui,sans-serif}main{max-width:780px;margin:8vh auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.brand{letter-spacing:.15em;color:var(--green);font-size:13px}h1{font-weight:500;font-size:42px;margin:12px 0}p{color:#8d9b92}form,.row{display:flex;gap:14px}input,select,button{font:inherit;border:0;border-radius:12px;padding:15px}input,select{background:#171e19;color:white;min-width:0;flex:1}select{flex:0 0 118px}input[type=time]{flex:0 0 138px}button{background:var(--green);color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}.quiet{background:#17221a;color:#a4b2a8}.tabs{display:flex;gap:10px;margin:28px 0 18px}.tabs button.active{color:#58e986;border:1px solid #00ae42}article{display:flex;align-items:center;gap:20px;border-top:1px solid #253129;padding:22px 0}article span{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}article small{display:block;color:#849188;margin-top:8px}article button{padding:10px 16px}#message{min-height:24px;color:#b8c8be}footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.led{display:inline-block;width:18px;height:18px;background:radial-gradient(circle,#00ae42 1px,transparent 2px) 0 0/5px 5px} [hidden]{display:none!important}@media(max-width:500px){main{margin:24px auto}form{flex-wrap:wrap}input{flex-basis:65%}h1{font-size:34px}}.bridge{border:1px solid #253129;border-radius:16px;padding:18px;margin-bottom:24px}.bridge .row{flex-wrap:wrap;align-items:center}.bridge p{margin:10px 0;font-size:14px}.bridge a{color:#58e986}.bridge code{overflow-wrap:anywhere}.options{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.options label{color:#a4b2a8;font-size:14px}.options select,.options input{display:block;margin-top:8px;width:100%;padding:12px}#create{display:block}#create .row input{flex:1}article a{color:#58e986;font-size:13px}.error{color:#ffae83!important}</style>
<main><header><div><div class="brand"><i class="led"></i> P4 / DESK</div><h1>把今天做好。</h1></div><button class="quiet" id="logout" hidden>退出</button></header>
<form id="login"><input id="password" type="password" placeholder="输入访问密码" aria-label="访问密码" autocomplete="current-password" required><button>登录</button></form>
<section id="workspace" hidden>
<div class="bridge"><div class="row"><strong>飞书个人任务</strong><button id="feishu-connect" class="quiet" type="button">连接飞书</button><button id="feishu-sync" class="quiet" type="button" disabled>立即同步</button></div><p id="feishu-status" role="status">尚未连接</p><details><summary>首次连接设置</summary><p>在飞书应用后台的「安全设置」添加重定向 URL：</p><code id="redirect-uri"></code><p>在「权限管理」开通用户身份权限 <code>task:task:write</code> 和 <code>offline_access</code>，发布版本后点击连接。</p><a id="feishu-console" href="https://open.feishu.cn/app" hidden target="_blank" rel="noopener noreferrer">打开飞书应用后台 ↗</a></details></div>
<form id="create"><div class="row"><input id="title" maxlength="80" placeholder="接下来要完成什么？" aria-label="新待办" required><button id="publish">发布待办</button></div><div class="options"><label>任务类别<select id="repeat"><option value="0">一次性</option><option value="1">每日</option></select></label><label>提醒时间（可选）<input id="remind" type="time"></label><label>同步范围<select id="sync-scope"><option value="local">仅网页 + ESP32</option><option value="feishu">同时同步飞书</option></select></label></div><p style="font-size:13px">每日任务北京时间零点恢复待办；不设置时间则不提醒。仅本地任务不会上传飞书。</p></form><div class="tabs"><button class="quiet active" id="pending">待完成</button><button class="quiet" id="completed">已完成</button></div><div id="list"></div><footer><button class="quiet" id="prev">上一页</button><span id="page"></span><button class="quiet" id="next">下一页</button></footer></section><p id="message" role="status"></p></main>
<script>
const $=id=>document.getElementById(id);
let page=0,done=0,pages=1,lastSnapshot='',loading=false;
const pad=n=>String(n).padStart(2,'0'),fmtMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function clock(){const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return {date:Number(p.year+p.month+p.day),minute:Number(p.hour)*60+Number(p.minute)}}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(r.status===401){$('workspace').hidden=true;$('logout').hidden=true;$('login').hidden=false}if(!r.ok)throw Error(data.error);return data}
async function bridgeStatus(){const s=await api('/api/feishu/status');$('redirect-uri').textContent=s.redirect_uri;$('feishu-connect').textContent=s.connected?'重新授权':'连接飞书';$('feishu-sync').disabled=!s.connected;const el=$('feishu-status');el.classList.toggle('error',!!s.error);el.textContent=s.error||(s.connected?`${s.name} · ${s.last_sync?'最近同步 '+new Date(s.last_sync*1000).toLocaleTimeString():'等待首次同步'} · ${s.pending} 项待同步`:'尚未连接；本地任务正常使用');const consoleLink=$('feishu-console');if(consoleLink&&s.app_id){consoleLink.href='https://open.feishu.cn/app/'+encodeURIComponent(s.app_id);consoleLink.hidden=false}}
async function checkReminders(){const current=clock();let p=0,total=1;while(p<total){const data=await api(`/api/todos?page=${p}&done=0`);total=data.pages;for(const item of data.items){if(item.remind_minute===null||current.minute<item.remind_minute||Number(item.reminded_date)===current.date||(!item.daily&&item.reminded_date!==null))continue;await api(`/api/todos/${item.id}/notified`,{});$('message').textContent='⏰ 提醒：'+item.title;if('Notification' in window&&Notification.permission==='granted')new Notification('待办提醒',{body:item.title})}p++}}
async function load(){if(loading)return;page=Math.max(0,Math.min(page,pages-1));loading=true;try{let data=await api(`/api/todos?page=${page}&done=${done}`);if(page>=data.pages){page=data.pages-1;data=await api(`/api/todos?page=${page}&done=${done}`)}pages=data.pages;$('login').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;const signature=done+JSON.stringify(data);if(signature!==lastSnapshot){lastSnapshot=signature;$('list').replaceChildren();for(const item of data.items){const row=document.createElement('article'),text=document.createElement('span'),small=document.createElement('small');text.textContent=item.title;const tags=[item.daily?'每日':item.remote_repeat?'飞书重复任务':'一次性',item.sync_feishu?(item.dirty?'飞书待同步':'飞书'):'仅本地'];if(item.scheduled_minute!==null)tags.push((item.remind_date?String(item.remind_date)+' ':'')+'提醒 '+fmtMin(item.scheduled_minute));small.textContent=tags.join(' · ');text.append(small);if(item.feishu_guid){const link=document.createElement('a');link.href='https://applink.feishu.cn/client/todo/detail?guid='+encodeURIComponent(item.feishu_guid);link.textContent='在飞书打开 ↗';link.target='_blank';link.rel='noopener noreferrer';text.append(link)}row.append(text);const button=document.createElement('button');button.textContent=done?'已完成':'完成';button.disabled=!!done;button.onclick=()=>run(async()=>{button.disabled=true;try{await api(`/api/todos/${item.id}/complete`,{});await load()}finally{button.disabled=!!done}});row.append(button);$('list').append(row)}if(!data.items.length)$('list').textContent=done?'还没有已完成的任务。':'全部处理好了。';$('page').textContent=`${page+1} / ${pages} · ${data.total} 项`;$('prev').disabled=page===0;$('next').disabled=page+1>=pages;}await bridgeStatus();await checkReminders()}finally{loading=false}}
async function run(fn){try{await fn()}catch(e){$('message').textContent=e.message}}
function tabs(){$('pending').classList.toggle('active',!done);$('completed').classList.toggle('active',!!done)}
$('login').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/login',{password:$('password').value});$('password').value='';$('message').textContent='';lastSnapshot='';if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();await load()})};
$('create').onsubmit=e=>{e.preventDefault();run(async()=>{$('publish').disabled=true;try{const result=await api('/api/todos',{title:$('title').value,daily:$('repeat').value==='1',remind:$('remind').value||null,sync_feishu:$('sync-scope').value==='feishu'});$('title').value='';$('remind').value='';page=0;done=0;tabs();$('message').textContent=result.sync_pending?'已保存，等待飞书同步':'已发布到网页和 ESP32';await load()}finally{$('publish').disabled=false}})};
$('feishu-connect').onclick=()=>run(async()=>{const result=await api('/api/feishu/connect',{});location.assign(result.url)});
$('feishu-sync').onclick=()=>run(async()=>{await api('/api/feishu/sync',{});$('message').textContent='已请求同步，稍后刷新状态'});
$('pending').onclick=()=>{if(loading)return;done=0;page=0;tabs();run(load)};$('completed').onclick=()=>{if(loading)return;done=1;page=0;tabs();run(load)};$('prev').onclick=()=>{if(loading||page===0)return;page--;run(load)};$('next').onclick=()=>{if(loading||page+1>=pages)return;page++;run(load)};$('logout').onclick=()=>run(async()=>{await api('/api/logout',{});location.reload()});
const result=new URLSearchParams(location.search).get('feishu');if(result){$('message').textContent=result==='connected'?'飞书授权成功，正在同步个人任务':'已取消飞书授权';history.replaceState({},'',location.pathname)}run(load);setInterval(()=>{if(!$('workspace').hidden)run(load)},5000);
</script></html>
