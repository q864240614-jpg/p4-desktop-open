<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P4 · 打印机连接</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#030303;color:#f5f5f2;font:16px system-ui;max-width:680px;margin:36px auto;padding:24px}h1{font-size:28px;font-weight:550}h2{font-size:20px;margin:0 0 20px}section{background:#111615;border:1px solid #203128;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin:18px 0 8px;color:#b0bdb5}input,select,textarea,button{width:100%;padding:13px;background:#202822;color:white;border:1px solid #354039;border-radius:8px;font:inherit}textarea{resize:vertical;font:13px monospace}button{background:#00ae42;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}p,small{line-height:1.7;color:#a3b2a7}a{color:#63db91}.led{display:inline-block;width:9px;height:9px;margin-right:9px;background:#00ae42;box-shadow:0 0 12px #00ae4280}#status{white-space:pre-wrap;color:#e3eddf}small{display:block}details{margin-top:16px}summary{cursor:pointer;color:#a3b2a7}[hidden]{display:none!important}
</style>
<h1><span class="led"></span>打印机连接</h1><p>H2D + A1 mini · 连接同一个拓竹账号下的两台打印机</p>
<form id="form">
<section id="cloud"><h2>Bambu Cloud</h2><label for="region">账号区域</label><select name="region" id="region"><option value="cn">中国大陆 · bambulab.cn</option><option value="us">国际区 · bambulab.com</option></select>
<label for="token">拓竹账号 Access token</label><textarea id="token" name="token" rows="4" maxlength="2047" autocomplete="off" spellcheck="false" placeholder="粘贴 token 值，不含 Bearer 前缀"></textarea><small id="token-note">令牌只用于拓竹 Cloud 认证。</small>
<p>在对应区域的拓竹官网登录，用浏览器开发者工具的 Application / Storage → Cookies 找到 <b>token</b>，复制其值。不要填写 Wi-Fi 密码或 Codex token。</p>
<small>Cloud 模式需要打印机连接拓竹云端；请关闭打印机的 LAN Only。配置保存在 P4 中，已保存的令牌不会在网页回显。</small>
<details><summary>手动账号 ID（一般不需要）</summary><label for="username">MQTT 用户名</label><input name="username" id="username" maxlength="79" placeholder="u_账号UID" autocomplete="off"><small>通常会从令牌自动识别；仅非 JWT 令牌需要手动填写。</small></details></section>
<div id="printers"></div><button id="save">保存并重启 P4</button><p id="status" role="status"></p>
</form>
<script>
const form=document.getElementById('form'),status=document.getElementById('status'),save=document.getElementById('save');
const names=['H2D','A1 mini'];let savedRegion='cn',hasToken=false;
names.forEach((name,i)=>{document.getElementById('printers').insertAdjacentHTML('beforeend',`<section><h2>${name}</h2><small id="connection${i}">未配置</small><label for="mode${i}">连接方式</label><select id="mode${i}" name="mode${i}"><option value="cloud">Bambu Cloud</option><option value="lan">LAN 直连</option><option value="off">停用</option></select><div id="device${i}"><label for="serial${i}">打印机序列号 SN</label><input id="serial${i}" name="serial${i}" maxlength="39" autocomplete="off" placeholder="打印机设置 → 设备信息中的序列号"><div id="lan${i}"><small>视频通过局域网直连，即使状态使用 Cloud 也需要以下信息；不使用视频时 Cloud 模式可留空。H2D 需在打印机上开启局域网直播。</small><label for="ip${i}">打印机 IPv4 地址（LAN 状态 / 视频）</label><input id="ip${i}" name="ip${i}" maxlength="15" placeholder="192.168.3.xxx"><label for="code${i}">LAN 访问码</label><input id="code${i}" name="code${i}" type="password" maxlength="63" autocomplete="new-password" placeholder="同一打印机留空可保留已有访问码"></div></div></section>`)});
function update(){let cloud=false;names.forEach((_,i)=>{let mode=form.elements['mode'+i].value;cloud ||= mode==='cloud';document.getElementById('device'+i).hidden=mode==='off';document.getElementById('lan'+i).hidden=mode==='off';form.elements['serial'+i].required=mode!=='off';form.elements['ip'+i].required=mode==='lan'});document.getElementById('cloud').hidden=!cloud;document.getElementById('token-note').textContent=hasToken&&form.elements.region.value===savedRegion?'已保存令牌，留空保留；填写新令牌会替换。':'粘贴当前区域账号的令牌。';}
form.addEventListener('change',update);update();save.disabled=true;
fetch('/settings',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('读取配置失败，请刷新并使用屏幕 PIN 登录');return r.json()}).then(c=>{for(const [k,v]of Object.entries(c))if(form.elements[k])form.elements[k].value=v;savedRegion=c.region;hasToken=c.has_token;names.forEach((_,i)=>document.getElementById('connection'+i).textContent=c['status'+i]||'未配置');if(c.mode0==='off'&&c.mode1==='off'){form.elements.mode0.value='cloud';form.elements.mode1.value='cloud'}update();save.disabled=false}).catch(e=>status.textContent=e.message);
form.onsubmit=async e=>{e.preventDefault();save.disabled=true;status.textContent='正在保存…';const data=Object.fromEntries(new FormData(form));for(const key of Object.keys(data))data[key]=data[key].trim();try{const r=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const text=await r.text();status.textContent=r.ok?'已保存，P4 正在重启。稍后使用屏幕上的新 PIN 重新登录。':text;if(!r.ok)save.disabled=false;else document.getElementById('token').value=''}catch(e){status.textContent='连接中断，请查看 P4 是否已经重启。';save.disabled=false}};
</script></html>
